apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pvc-autoresizer
  namespace: flux-system
spec:
  interval: 1h
  url: https://topolvm.github.io/pvc-autoresizer/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pvc-autoresizer
  namespace: monitoring
spec:
  interval: 10m
  releaseName: pvc-autoresizer
  chart:
    spec:
      chart: pvc-autoresizer
      version: "0.20.*"
      sourceRef:
        kind: HelmRepository
        name: pvc-autoresizer
        namespace: flux-system
      interval: 1h
  values:
    controller:
      replicas: 1
      args:
        useK8sMetricsApi: true
        prometheusURL: ""
        namespaces:
          - podinfo
        interval: 30s
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi
    webhook:
      certificate:
        generate: true
    cert-manager:
      enabled: false