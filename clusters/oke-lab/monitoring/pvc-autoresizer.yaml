apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pvc-autoresizer
  namespace: flux-system
spec:
  interval: 1h
  url: https://topolvm.github.io/pvc-autoresizer/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pvc-autoresizer
  namespace: monitoring
spec:
  interval: 10m
  releaseName: pvc-autoresizer
  chart:
    spec:
      chart: pvc-autoresizer
      version: "0.20.*"
      sourceRef:
        kind: HelmRepository
        name: pvc-autoresizer
        namespace: flux-system
      interval: 1h
  values:
    controller:
      replicas: 1
      args:
        useK8sMetricsApi: true
        prometheusURL: ""
        namespaces:
          - podinfo
        interval: 30s
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi
    webhook:
      certificate:
        generate: true
    cert-manager:
      enabled: false
---
# Supplemental permissions for pvc-autoresizer's Kubernetes metrics mode.
# nodes/proxy permits access to node proxy endpoints, not only metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-autoresizer-node-metrics
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-autoresizer-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-autoresizer-node-metrics
subjects:
  - kind: ServiceAccount
    name: pvc-autoresizer-controller
    namespace: monitoring